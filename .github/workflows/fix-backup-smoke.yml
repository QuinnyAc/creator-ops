name: Finalize backup restore smoke

on:
  push:
    branches:
      - ops/database-backup-restore

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix PostgreSQL marker quoting
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/backup-restore-smoke.yml")
          text = path.read_text()
          old = "VALUES (1, ''creator-ops-backup-ok'');"
          new = "VALUES (1, $$creator-ops-backup-ok$$);"
          if old not in text:
              raise SystemExit("Expected smoke-test SQL marker was not found")
          path.write_text(text.replace(old, new))
      - name: Remove one-time finalizer
        run: rm .github/workflows/fix-backup-smoke.yml
      - name: Commit finalized smoke test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(ops): fix restore smoke SQL quoting"
          git push
