name: Finalize frontend lockfile

on:
  push:
    branches:
      - chore/frontend-lockfile-v2

# One-time workflow: it removes itself after committing the generated lockfile.
permissions:
  contents: write

concurrency:
  group: finalize-frontend-lockfile-v2
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Generate package-lock.json
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Switch builds to npm ci
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("apps/web/Dockerfile"): [
                  ("COPY package.json ./", "COPY package.json package-lock.json ./"),
                  ("RUN npm install", "RUN npm ci"),
              ],
              Path("apps/web/Dockerfile.prod"): [
                  ("COPY package.json ./", "COPY package.json package-lock.json ./"),
                  ("RUN npm install", "RUN npm ci"),
              ],
              Path(".github/workflows/ci.yml"): [
                  ("run: npm install", "run: npm ci"),
              ],
              Path(".github/workflows/release.yml"): [
                  ("          npm install\n", "          npm ci\n"),
              ],
              Path("README.md"): [
                  ("cd apps/web\nnpm install\nnpm run dev", "cd apps/web\nnpm ci\nnpm run dev"),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text)
      - name: Verify lockfile can drive install
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Remove one-time finalizer
        run: rm .github/workflows/finalize-frontend-lockfile.yml
      - name: Commit final dependency state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(web): lock npm dependencies and use npm ci"
          git push
