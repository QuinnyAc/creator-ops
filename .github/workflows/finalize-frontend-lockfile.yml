name: Finalize frontend lockfile

on:
  push:
    branches:
      - chore/frontend-lockfile-v2

# One-time helper. It only commits the generated lockfile; workflow/build edits
# are applied separately so the GitHub Actions token never needs workflow-write permission.
permissions:
  contents: write

concurrency:
  group: finalize-frontend-lockfile-v2
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Generate package-lock.json
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile can drive install
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Commit package lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "build(web): lock npm dependencies"
          git push
